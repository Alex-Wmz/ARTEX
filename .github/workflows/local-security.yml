name: Local security review

on:
  push:
    branches: ["codex/local-security-hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NORMA_RIPGREP_NO_INSTALL: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: ci-isolated-test-only
          POSTGRES_DB: artex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:ci-isolated-test-only@127.0.0.1:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Review Go formatting
        run: |
          git diff-tree --no-commit-id --name-only -r HEAD -- '*.go' | xargs -r gofmt -d
      - name: Proxy TLS and startup regression tests
        run: go test -count=1 ./traffic ./selfupdate ./config ./cmd/artex
      - name: Management, update and notification regression tests
        run: go test -count=1 -v ./server -run 'Test(LocalSecurity|ReleaseCache)'

  review-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install locked frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: web
      - name: Export the frontend
        run: npm run build:static
        working-directory: web
      - name: Build review packages without publishing a release
        env:
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_PACKAGE: "1"
          ARTEX_COMPRESS: "off"
          ARTEX_TARGETS: linux/amd64,windows/amd64
        run: |
          mkdir -p server/webui/dist
          cp -a web/out/. server/webui/dist/
          ARTEX_BUILD_VERSION="0.3.20-local-${GITHUB_SHA::7}" ./build.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: artex-local-review-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
